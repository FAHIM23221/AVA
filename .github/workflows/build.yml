name: Build AVA APK

# Runs automatically every time you push code, and can also be triggered manually
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # lets you click "Run workflow" manually from the Actions tab

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build-log.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Report build failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### ❌ Build failed — ${GITHUB_SHA:0:7}"
            echo
            echo '```'
            grep -aE "^e: |error:|FAILURE:|What went wrong|Execution failed|> Task .*FAILED|Caused by:" build-log.txt | head -40 || true
            echo '```'
            echo
            echo '<details><summary>full log</summary>'
            echo
            echo '```'
            tail -c 6000 build-log.txt || true
            echo '```'
            echo '</details>'
          } > /tmp/report.md
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Build failed: ${GITHUB_SHA:0:7}" \
            --body-file /tmp/report.md || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AVA-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build summary
        if: success()
        run: echo "✅ APK built successfully! Download it from the Artifacts section below." >> $GITHUB_STEP_SUMMARY
