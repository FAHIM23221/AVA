name: Auto Extract ZIP

# Whenever a .zip shows up in this repository (pushed / uploaded through the
# GitHub web UI, a PR, or a release asset) the archive is unpacked automatically:
#
#   * the files land directly in the place the archive lives (repo root),
#   * a single top level folder inside the archive is stripped,
#   * files with the same name are replaced,
#   * files of the previous extraction that are gone in the new archive are
#     removed automatically,
#   * the uploaded archive itself is deleted afterwards.

on:
  push:
    # Any branch — a ZIP uploaded to main or to a feature branch is extracted.
    paths:
      - '*.zip'
      - '**/*.zip'
  release:
    types: [ published, prereleased, created ]
  workflow_dispatch:
    inputs:
      source_url:
        description: 'Optional: direct URL of a .zip to extract (leave empty to scan the repository)'
        required: false
        type: string
      keep_archive:
        description: 'Keep the uploaded .zip after extraction (1 = yes, 0 = no)'
        required: false
        default: '0'
        type: string

permissions:
  contents: write
  pull-requests: write

# Never run two extractions at the same time for the same branch.
concurrency:
  group: auto-extract-zip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    name: Extract ZIP archives
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract archives
        id: extract
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_DIR: ${{ github.workspace }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SOURCE_URL: ${{ inputs.source_url }}
          KEEP_ARCHIVE: ${{ inputs.keep_archive }}
          OUTPUT_LIST_FILE: ${{ runner.temp }}/extracted-dirs.txt
          REPORT_FILE: ${{ runner.temp }}/extract-report.txt
        run: bash .github/scripts/extract-zips.sh

      - name: Collect extracted folders
        id: collect
        if: always()
        run: |
          {
            echo 'paths<<EOF'
            cat "${{ runner.temp }}/extracted-dirs.txt" 2>/dev/null || true
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload extracted files as artifact
        if: always() && steps.collect.outputs.paths != ''
        uses: actions/upload-artifact@v4
        with:
          name: extracted-files-${{ github.run_number }}
          path: ${{ steps.collect.outputs.paths }}
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit extracted files back to the repository
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'release')
        continue-on-error: true
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          target_ref="${{ github.ref_name }}"

          # A release is checked out on its tag, so commit the extracted files
          # to the default branch instead.
          if [ "${{ github.event_name }}" = "release" ]; then
            target_ref="$DEFAULT_BRANCH"
            git fetch --depth=1 origin "$target_ref"
            git checkout -B "$target_ref" "origin/$target_ref"
          fi

          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing new to commit.'
            exit 0
          fi

          # "[skip actions]" stops this workflow (and the build workflow) from
          # running again on the commit we are about to create.
          git commit -m 'chore: auto-extract ZIP archives [skip actions]'

          if ! git push origin "HEAD:$target_ref"; then
            # The branch is protected — open a pull request instead so the
            # extracted files still reach the repository.
            echo "::warning::Push to $target_ref was rejected, opening a pull request instead."
            fallback_branch="auto-extract/$(date -u +%Y%m%d-%H%M%S)"
            git checkout -B "$fallback_branch"
            git push origin "$fallback_branch"
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$target_ref" \
              --head "$fallback_branch" \
              --title 'chore: auto-extract ZIP archives' \
              --body "The ZIP auto-extract workflow could not push directly to \`$target_ref\` (branch protection). These are the extracted files — review and merge them." || true
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo '## 🗜️ ZIP auto-extract'
            echo
            if [ -s "${{ runner.temp }}/extract-report.txt" ]; then
              echo '```'
              cat "${{ runner.temp }}/extract-report.txt"
              echo '```'
            elif [ -s "${{ runner.temp }}/extracted-dirs.txt" ]; then
              echo 'Extracted folders:'
              echo
              echo '```'
              cat "${{ runner.temp }}/extracted-dirs.txt"
              echo '```'
            else
              echo 'No ZIP archive was found.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
